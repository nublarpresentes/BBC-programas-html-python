<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro — Categoria do Assentado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>.form-section{background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.08)}</style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<!-- Cabeçalho -->
<header class="bg-success text-white shadow-sm">
  <div class="container">
    <!-- Linha com logo e título -->
    <div class="d-flex align-items-center py-2">
      <img src="/static/img/ifpaLogo.png" alt="IFPA Logo" class="me-3" style="height:60px;">
      <h1 class="h4 mb-0">SBBC - Sistema Banco do Bem Comum</h1>
    </div>

    <!-- Linha com o menu principal -->
    <nav class="nav justify-content-center border-top border-light pt-2">
      <a class="nav-link text-white" href="/menuBBC">
        <i class="bi bi-house-door-fill"></i> Home
      </a>
      <a class="nav-link text-white" href="/menuAssent">
        <i class="bi bi-people-fill"></i> Assentado
      </a>
      <a class="nav-link text-white" href="/menuBBC">
        <i class="bi bi-bank"></i> Banco do Bem Comum
      </a>
      <a class="nav-link text-white" href="/menuCaderneta">
        <i class="bi bi-journal-bookmark-fill"></i> Caderneta da Partilha
      </a>
      <a class="nav-link text-white" href="/faleConosco">
        <i class="bi bi-chat-dots-fill"></i> Fale Conosco
      </a>
    </nav>
  </div>
</header>


<main class="flex-grow-1">
  <div class="container my-4">
    <div class="form-section">
      <h3 class="text-success mb-3">Cadastro — Categoria do Assentado</h3>

      {% if message %}<div class="alert alert-info">{{ message }}</div>{% endif %}

      <form action="/cadCtgAssent" method="POST" class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Nome da Categoria</label>
          <input type="text" name="nomCtgAssent" class="form-control" maxlength="50" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Descrição</label>
          <input type="text" name="descricao" class="form-control" maxlength="200" />
        </div>

        <div class="col-12 text-center">
          <button type="submit" class="btn btn-success">Cadastrar</button>
          <a href="/menuBBC" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
  <p class="mb-0">Endereço: xxxxxxxxxxxxxxxxxxx - Bairro: xxxxxxxxxxxx - Abaetetuba-PA</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
