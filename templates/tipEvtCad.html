<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Tipo de Evento — Cadastro</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>.required::after{content:" *";color:#dc3545}</style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header class="bg-success text-white shadow-sm">
  <div class="container d-flex align-items-center py-2">
    <img src="/static/img/logo_bbc.png" style="height:54px" class="me-3" alt="BBC">
    <h1 class="h5 mb-0">TPP — Tipo de Evento (Cadastro)</h1>
  </div>
</header>

<main class="container my-4 flex-grow-1">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% if msgs %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ cat if cat in ['success','warning','danger','info','primary','secondary'] else 'info' }}">{{ msg|safe }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form action="/cadTipEvt" method="POST" class="row g-3 bg-white p-3 rounded shadow-sm">
    <div class="col-md-8">
      <label class="form-label fw-bold required">Nome do Tipo de Evento</label>
      <input type="text" name="nomTipEvt" class="form-control" required placeholder="ex.: Notícia, Reunião, Curso…">
    </div>
    <div class="col-12 text-center">
      <button class="btn btn-success">Cadastrar</button>
      <a href="/tipEvtAlt" class="btn btn-secondary">Alterar/Ver lista</a>
    </div>
  </form>
</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
  <small>TPP • Abaetetuba-PA</small>
</footer>
</body>
</html>
