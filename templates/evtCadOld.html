<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <title>Cadastro de Evento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .form-section{background:#fff;padding:16px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
    .required::after{content:" *";color:#dc3545}
  </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<header class="bg-success text-white shadow-sm">
  <div class="container d-flex align-items-center py-2">
    <img src="/static/img/logo_bbc.png" style="height:60px" class="me-3" alt="IFPA">
    <h1 class="h4 mb-0">SBBC — Cadastro de Evento</h1>
  </div>
</header>

<main class="flex-grow-1">
  <div class="container my-4">
    <div class="form-section">
      <h5 class="text-success mb-3">Novo Evento</h5>

      {% with msgs = get_flashed_messages(with_categories=true) %}
        {% if msgs %}
          {% for cat, msg in msgs %}
            <div class="alert alert-{{ cat if cat in ['success','warning','danger','info','primary','secondary'] else 'info' }} text-center mb-3">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="/cadEvt" method="POST" enctype="multipart/form-data" class="row g-3">
        <!-- Básico -->
        <div class="col-md-8">
          <label class="form-label fw-bold required">Nome do Evento (Título)</label>
          <input type="text" name="nomEvt" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold required">Tipo de Evento</label>
          <select name="idTipEvt" id="idTipEvt" class="form-select" required>
            <option value="">-- selecione --</option>
            {% for t in tipos %}
              <option value="{{ t[0] }}">{{ t[1] }} ({{ t[0] }})</option>
            {% endfor %}
          </select>
        </div>

        <!-- Campos comuns (opcionais) -->
        <div class="col-md-6">
          <label class="form-label fw-bold">Responsável</label>
          <input type="text" name="responsavel" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold">Tipo de presença</label>
          <input type="text" name="tippresenca" class="form-control" placeholder="Ex.: P/O">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-bold">Fones</label>
          <input type="text" name="fones" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Local</label>
          <input type="text" name="local" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Link (Plataforma Online)</label>
          <input type="url" name="linkplatonline" class="form-control" placeholder="https://...">
        </div>

        <!-- BLOCO: Notícia (idTipEvt = 1) -->
        <div id="blocoNoticia" class="row g-3 d-none">
          <div class="col-12"><hr></div>
          <div class="col-md-3">
            <label class="form-label fw-bold required">Capa?</label>
            <select name="capa" id="capa" class="form-select">
              <option value="">-- selecione --</option>
              <option value="S">S (destaque)</option>
              <option value="N">N</option>
            </select>
          </div>
          <div class="col-md-9">
            <label class="form-label fw-bold">Foto da Capa (opcional)</label>
            <input type="file" name="foto" accept=".jpg,.jpeg,.png,.gif,.webp" class="form-control">
            <small class="text-muted">Será salva em <code>static/img/eventos/</code></small>
          </div>
        </div>

        <!-- BLOCO: Reunião (idTipEvt = 2) -->
        <div id="blocoReuniao" class="row g-3 d-none">
          <div class="col-12"><hr></div>

          <div class="col-md-2">
            <label class="form-label fw-bold required">Turno</label>
            <select name="turno" id="turno" class="form-select">
              <option value="">-- selecione --</option>
              <option value="M">M</option>
              <option value="T">T</option>
              <option value="N">N</option>
            </select>
          </div>

          <div class="col-md-10">
            <label class="form-label fw-bold required">Pauta</label>
            <input type="text" name="pauta" id="pauta" class="form-control">
          </div>

          <div class="col-md-3">
            <label class="form-label fw-bold required">Início</label>
            <input type="date" name="dtIniPer" id="dtIniPer" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold required">Fim</label>
            <input type="date" name="dtFimPer" id="dtFimPer" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Foto (opcional)</label>
            <input type="file" name="foto" accept=".jpg,.jpeg,.png,.gif,.webp" class="form-control">
          </div>
        </div>

        <div class="col-12 text-center mt-2">
          <button class="btn btn-success">Cadastrar</button>
          <a class="btn btn-secondary" href="/menuEventos">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
  <p class="mb-0">Endereço: xxxxxxxxx — Abaetetuba-PA</p>
</footer>

<script>
  const selTipo = document.getElementById('idTipEvt');
  const blocoNoticia = document.getElementById('blocoNoticia');
  const blocoReuniao = document.getElementById('blocoReuniao');

  function trocarBloco(){
    const idTipo = selTipo?.value || '';
    const isNoticia = (idTipo === '1');
    const isReuniao = (idTipo === '2');

    blocoNoticia.classList.toggle('d-none', !isNoticia);
    blocoReuniao.classList.toggle('d-none', !isReuniao);
  }

  selTipo?.addEventListener('change', trocarBloco);
  trocarBloco();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
