<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Consulta - Grupos de Partilha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>.form-section{background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.08)}</style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header class="bg-success text-white py-3 shadow-sm">
  <div class="container d-flex align-items-center">
    <img src="/static/img/logo_bbc.png" class="me-3" style="height:60px;" alt="logo">
    <h1 class="h4 mb-0">TPP - Tecnologia do Painel da Partilha</h1>
  </div>
</header>

<main class="flex-grow-1">
  <div class="container my-4">
    <div class="form-section">
      <h4 class="text-primary mb-3">Todos os Grupos de Partilha</h4>
      <div class="table-responsive">
        <table class="table table-sm table-striped align-middle">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nome</th>
            </tr>
          </thead>
          <tbody>
            {% for i in itens %}
            <tr>
              <td>{{ i[0] }}</td>
              <td>{{ i[1] }}</td>
            </tr>
            {% else %}
            <tr><td colspan="2" class="text-center text-muted">Nenhum registro.</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
  <p class="mb-0">Endereço: xxxxxxxxxxxxxxxxxxx - Bairro: xxxxxxxxxxxx - Abaetetuba-PA</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
