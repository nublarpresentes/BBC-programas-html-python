<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro — Tipo de Recompensa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>.form-section{background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.08)}</style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header class="bg-success text-white shadow-sm">
  <div class="container d-flex align-items-center py-2">
    <img src="/static/img/logo_bbc.png" alt="IFPA" class="me-3" style="height:60px;">
    <h1 class="h4 mb-0">SBBC</h1>
  </div>
</header>

<main class="flex-grow-1">
  <div class="container my-4">
    <div class="form-section">
      <h3 class="text-success">Cadastro — Tipo de Recompensa</h3>
      {% with msgs=get_flashed_messages(with_categories=true) %}
      {% if msgs %}
        {% for cat,msg in msgs %}
          <div class="alert alert-{{ 'info' if cat not in ['success','warning','danger'] else cat }} mt-3">{{ msg }}</div>
        {% endfor %}
      {% endif %}
      {% endwith %}

      <form action="/cadTipRecpsa" method="POST" class="row g-3 mt-2">
        <div class="col-md-8">
          <label class="form-label fw-bold">Nome da Recompensa</label>
          <input type="text" name="nomTipRecpsa" class="form-control" maxlength="100" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Política Pública (opcional)</label>
          <select name="idPolPub" class="form-select">
            <option value="">— Nenhuma —</option>
            {% for p in politicas %}
              <option value="{{ p[0] }}">{{ p[1] }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12 mt-2 text-center">
          <button type="submit" class="btn btn-success">Cadastrar</button>
          <a href="/menuBBC" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
  <p class="mb-0">Endereço: xxxxxxxxx — Abaetetuba-PA</p>
</footer>
</body>
</html>
