<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <title>Cadastrar Assentado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>.form-section{background:#fff;padding:18px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.08)}</style>
</head>
<body class="bg-light">

<header class="bg-success text-white shadow-sm">
  <div class="container d-flex align-items-center py-2">
    <img src="/static/img/ifpaLogo.png" alt="IFPA Logo" class="me-3" style="height:60px;">
    <h1 class="h4 mb-0">Cadastro de Assentado</h1>
  </div>
</header>

<main class="container my-4">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% if msgs %}
      {% for cat,msg in msgs %}
        <div class="alert alert-{{cat}}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form action="/cadAssent" method="POST" class="form-section row g-3">
    <div class="col-md-6">
      <label class="form-label fw-bold">Nome</label>
      <input type="text" name="nome" class="form-control" maxlength="150" required>
    </div>

    <div class="col-md-2">
      <label class="form-label fw-bold">Gênero</label>
      <select name="genero" class="form-select" required>
        <option value="">—</option>
        <option value="M">M</option>
        <option value="F">F</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label fw-bold">Mãe</label>
      <input type="text" name="mae" class="form-control" maxlength="80">
    </div>

    <div class="col-md-6">
      <label class="form-label fw-bold">Endereço</label>
      <input type="text" name="endereco" class="form-control" maxlength="250">
    </div>

    <div class="col-md-3">
      <label class="form-label fw-bold">Localização</label>
      <input type="text" name="bairro" class="form-control" maxlength="20">
    </div>

    <div class="col-md-3">
      <label class="form-label fw-bold">CPF</label>
      <input type="text" name="cpf" class="form-control" maxlength="14" placeholder="Somente números">
    </div>

    <div class="col-md-3">
      <label class="form-label fw-bold">RG</label>
      <input type="text" name="rg" class="form-control" maxlength="40">
    </div>

    <div class="col-md-3">
      <label class="form-label fw-bold">Órgão RG</label>
      <input type="text" name="rgOrgExp" class="form-control" maxlength="20">
    </div>

    <div class="col-md-3">
      <label class="form-label fw-bold">Data Nascimento</label>
      <input type="date" name="dtNasc" class="form-control">
    </div>

    <div class="col-md-2">
      <label class="form-label fw-bold">UF Nasc.</label>
      <select name="ufNasc" id="ufNasc" class="form-select">
        <option value="">—</option>
        {% for u in ufs %}
          <option value="{{u[0]}}">{{u[0]}} - {{u[1]}}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-7">
      <label class="form-label fw-bold">Município Nascimento</label>
      <select name="codMunNas" id="codMunNas" class="form-select">
        <option value="">— selecione a UF primeiro (opcional) —</option>
        {% for m in municipios %}
          <option value="{{m[0]}}">{{m[1]}}</option>
        {% endfor %}
      </select>
      <div class="form-text">Se a lista estiver vazia, selecione a UF e salve mesmo assim; você pode alterar depois.</div>
    </div>

    <div class="col-md-4">
      <label class="form-label fw-bold">E-mail</label>
      <input type="email" name="email" class="form-control" maxlength="100">
    </div>

    <div class="col-md-4">
      <label class="form-label fw-bold">WhatsApp</label>
      <input type="text" name="noWhatsapp" class="form-control" maxlength="20" placeholder="Somente números">
    </div>

    <div class="col-md-4">
      <label class="form-label fw-bold">Celular</label>
      <input type="text" name="celular" class="form-control" maxlength="13" placeholder="Somente números">
    </div>

    <div class="col-md-6">
      <label class="form-label fw-bold">Família Assentado</label>
      <select name="idFamilia" class="form-select">
        <option value="">—</option>
        {% for f in familias %}
          <option value="{{f[0]}}">{{f[1]}} ({{f[0]}})</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label fw-bold">Situação</label>
      <select name="idSitAssent" class="form-select">
        <option value="">—</option>
        <option value="1">Ativo</option>
        <option value="0">Inativo</option>
      </select>
    </div>

    <div class="col-12 text-center mt-2">
      <button class="btn btn-success">Cadastrar</button>
      <a href="/menuAssent" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</main>

<footer class="bg-dark text-white text-center py-3 mt-4">
  <small>SBBC • Assentado</small>
</footer>

</body>
</html>
