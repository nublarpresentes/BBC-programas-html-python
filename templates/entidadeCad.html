<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <title>Cadastro de Entidades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>.form-section{background:#fff;padding:16px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.08)}</style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header class="bg-success text-white shadow-sm">
  <div class="container d-flex align-items-center py-2">
    <img src="/static/img/logo_bbc.png" style="height:60px" class="me-3" alt="IFPA">
    <h1 class="h4 mb-0">SBBC — Entidades</h1>
  </div>
</header>
<main class="flex-grow-1">
  <div class="container my-4">
    <div class="form-section">
      <h5 class="text-success mb-3">Cadastro de Entidade</h5>

      {% with msgs = get_flashed_messages(with_categories=true) %}
        {% if msgs %}
          {% for cat,msg in msgs %}
            <div class="alert alert-{{cat}}">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="/cadEntidade" method="POST" class="row g-3">
        <div class="col-md-8">
          <label class="form-label fw-bold">Nome da Entidade</label>
          <input type="text" name="nomEntidade" class="form-control" maxlength="100" required>
        </div>
        <div class="col-12">
          <button class="btn btn-success">Cadastrar</button>
          <a href="/conEntidade" class="btn btn-outline-secondary">Consultar</a>
        </div>
      </form>
    </div>
  </div>
</main>
<footer class="bg-dark text-white text-center py-3 mt-auto">
  <p class="mb-0">Endereço: xxxxxxxxx — Abaetetuba-PA</p>
</footer>
</body>
</html>
