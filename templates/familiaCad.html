<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro de Família</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .form-section{background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.08);}
    .required::after{content:" *";color:#dc3545;}
  </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Cabeçalho -->
<header class="bg-success text-white shadow-sm">
  <div class="container">
    <!-- Linha com logo e título -->
    <div class="d-flex align-items-center py-2">
      <img src="/static/img/logo_bbc.png" alt="IFPA Logo" class="me-3" style="height:60px;">
      <h1 class="h4 mb-0">SBBC - Sistema Banco do Bem Comum</h1>
    </div>

    <!-- Linha com o menu principal -->
    <nav class="nav justify-content-center border-top border-light pt-2">
      <a class="nav-link text-white" href="/menuBBC">
        <i class="bi bi-house-door-fill"></i> Home
      </a>
      <a class="nav-link text-white" href="/menuAssent">
        <i class="bi bi-people-fill"></i> Assentado
      </a>
      <a class="nav-link text-white" href="/menuBBC">
        <i class="bi bi-bank"></i> Banco do Bem Comum
      </a>
      <a class="nav-link text-white" href="/menuCaderneta">
        <i class="bi bi-journal-bookmark-fill"></i> Caderneta da Partilha
      </a>
      <a class="nav-link text-white" href="/faleConosco">
        <i class="bi bi-chat-dots-fill"></i> Fale Conosco
      </a>
    </nav>
  </div>
</header>


<main class="flex-grow-1">
  <div class="container my-4">
    <div class="form-section">
      <h3 class="text-success text-center mb-4">Cadastro de Família</h3>

      {% if message %}
        <div class="alert alert-info text-center">{{ message }}</div>
      {% endif %}

      <form action="/cadFamilia" method="POST" class="row g-3">
        <div class="col-md-4">
          <label class="form-label fw-bold required">ID Família</label>
          <input type="text" name="idFamilia" class="form-control" maxlength="12"
                 placeholder="Até 12 caracteres" required>
        </div>

        <div class="col-md-8">
          <label class="form-label fw-bold required">Nome da Família</label>
          <input type="text" name="nomeFam" class="form-control" maxlength="100"
                 placeholder="Até 100 caracteres" required>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold">Nº de Membros</label>
          <input type="number" name="noMembros" class="form-control" min="0" placeholder="0, 1, 2...">
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold">Data de Cadastro</label>
          <input type="date" name="dtCadastro" class="form-control">
          <div class="form-text">Se vazio, será usada a data de hoje.</div>
        </div>

        <div class="col-12 text-center mt-2">
          <button type="submit" class="btn btn-success">Cadastrar</button>
          <a href="/menuBBC" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
  <p class="mb-0">Endereço: xxxxxxxxxxxxxxxxxxx - Bairro: xxxxxxxxxxxx - Abaetetuba-PA</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
