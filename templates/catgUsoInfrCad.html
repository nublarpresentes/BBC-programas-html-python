<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro — Categoria Uso Infra</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.box{background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.08)}</style>
</head>
<body class="bg-light">
<header class="bg-success text-white py-2">
  <div class="container"><h1 class="h5 m-0">SBBC — Categoria do Uso da Infraestrutura</h1></div>
</header>
<main class="container my-4">
  <div class="box">
    <h3 class="text-success">Cadastrar Categoria</h3>
    {% with msgs=get_flashed_messages(with_categories=true) %}
      {% for cat,msg in msgs %}
        <div class="alert alert-{{ 'info' if cat not in ['success','warning','danger'] else cat }} mt-3">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form action="/cadCatgUsoInfr" method="POST" class="row g-3 mt-2">
      <div class="col-md-8">
        <label class="form-label fw-bold">Nome da Categoria</label>
        <input type="text" name="nomCatgUsoInfr" class="form-control" maxlength="100" required>
      </div>
      <div class="col-12">
        <button class="btn btn-success">Cadastrar</button>
        <a href="/catgUsoInfrCon" class="btn btn-secondary">Consultar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
