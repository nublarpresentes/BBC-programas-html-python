<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Consulta — Categoria Uso Infra</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.box{background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.08)}</style>
</head>
<body class="bg-light">
<header class="bg-success text-white py-2">
  <div class="container"><h1 class="h5 m-0">TPP — Consulta Categoria Uso Infra</h1></div>
</header>

<main class="container my-4">
  <div class="box mb-4">
    <form action="/catgUsoInfrCon" method="GET" class="row g-3">
      <div class="col-md-8">
        <label class="form-label fw-bold">Nome contém</label>
        <input type="text" name="q" class="form-control" value="{{ q or '' }}" placeholder="ex.: Aniversário, Casa coletiva...">
      </div>
      <div class="col-12">
        <button class="btn btn-primary">Filtrar</button>
        <a class="btn btn-secondary" href="/catgUsoInfrCon">Limpar</a>
      </div>
    </form>
  </div>

  <div class="box">
    <h4 class="text-primary">Resultados</h4>
    <div class="table-responsive mt-2">
      <table class="table table-sm table-striped align-middle">
        <thead class="table-light"><tr><th>ID</th><th>Nome</th></tr></thead>
        <tbody>
        {% for r in itens %}
          <tr><td>{{ r[0] }}</td><td>{{ r[1] }}</td></tr>
        {% else %}
          <tr><td colspan="2" class="text-center text-muted">Nenhum resultado.</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
